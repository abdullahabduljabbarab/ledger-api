name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.12
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ledger"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger
      - run: pytest -v
        env:
          DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger

  deploy:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet
      - run: docker build -t europe-west2-docker.pkg.dev/ledger-api-507618/ledger-api/ledger-api .
      - run: docker push europe-west2-docker.pkg.dev/ledger-api-507618/ledger-api/ledger-api
      - run: >
          gcloud run deploy ledger-api
          --image europe-west2-docker.pkg.dev/ledger-api-507618/ledger-api/ledger-api
          --region europe-west2
          --allow-unauthenticated
          --add-cloudsql-instances ledger-api-507618:europe-west2:ledger-db
          --set-env-vars DATABASE_URL=postgresql://postgres:LedgerPass2026@/ledger?host=/cloudsql/ledger-api-507618:europe-west2:ledger-db
